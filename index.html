<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hyvoria Study - Nền Tảng Học Tập Đại Học</title>
    <!-- Google Fonts -->
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap"
      rel="stylesheet"
    />
    <!-- Font Awesome Icons -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />

    <style>
      :root {
        --primary-yellow: #f59e0b;
        --yellow-hover: #d97706;
        --yellow-light: #fef3c7;
        --bg-dark: #0f172a;
        --bg-card: rgba(30, 41, 59, 0.7);
        --text-light: #f8fafc;
        --text-muted: #94a3b8;
        --border-color: rgba(245, 158, 11, 0.2);
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: "Plus Jakarta Sans", sans-serif;
      }

      body {
        background-color: var(--bg-dark);
        color: var(--text-light);
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        overflow-x: hidden;
        position: relative;
      }

      /* Hiệu ứng nền phát sáng */
      .glow-bg {
        position: absolute;
        width: 600px;
        height: 600px;
        background: radial-gradient(
          circle,
          rgba(245, 158, 11, 0.15) 0%,
          rgba(15, 23, 42, 0) 70%
        );
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        z-index: 0;
        pointer-events: none;
      }

      /* Header Navigation */
      header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 20px 8%;
        z-index: 10;
        border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      }

      .logo-small {
        font-size: 1.2rem;
        font-weight: 700;
        color: var(--primary-yellow);
        text-decoration: none;
        letter-spacing: 1px;
      }

      nav a {
        color: var(--text-muted);
        text-decoration: none;
        margin-left: 2rem;
        transition: 0.3s;
        font-weight: 500;
      }

      nav a:hover {
        color: var(--primary-yellow);
      }

      /* Hero Section */
      .hero {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 60px 20px;
        z-index: 1;
        flex: 1;
      }

      .badge {
        background: rgba(245, 158, 11, 0.1);
        color: var(--primary-yellow);
        border: 1px solid var(--border-color);
        padding: 8px 18px;
        border-radius: 50px;
        font-size: 0.9rem;
        font-weight: 600;
        margin-bottom: 25px;
        letter-spacing: 0.5px;
      }

      .hero h1 {
        font-size: 4.5rem;
        font-weight: 800;
        margin-bottom: 15px;
        letter-spacing: -1px;

        /* 1. Thiết lập màu nền gradient */
        background: linear-gradient(
          135deg,
          #ffffff 0%,
          #fef3c7 50%,
          #f59e0b 100%
        );

        /* 2. Cắt nền theo khuôn chữ (Kèm cả thuộc tính chuẩn lẫn webkit) */
        background-clip: text;
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;

        /* 3. Tạo bóng đổ glow chuẩn xác không bị lỗi đè chữ */
        filter: drop-shadow(0 10px 20px rgba(245, 158, 11, 0.3));
      }

      .hero p {
        color: var(--text-muted);
        font-size: 1.2rem;
        max-width: 600px;
        margin-bottom: 50px;
        line-height: 1.6;
      }

      /* Danh mục chủ đề */
      .topics-grid {
        display: flex;
        gap: 20px;
        justify-content: center;
        flex-wrap: wrap;
        max-width: 1000px;
        width: 100%;
      }

      .topic-card {
        background: var(--bg-card);
        border: 1px solid var(--border-color);
        border-radius: 16px;
        padding: 25px 30px;
        width: 260px;
        text-decoration: none;
        color: var(--text-light);
        display: flex;
        flex-direction: column;
        align-items: center;
        backdrop-filter: blur(10px);
        transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        position: relative;
        overflow: hidden;
      }

      .topic-card::before {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 3px;
        background: var(--primary-yellow);
        opacity: 0;
        transition: 0.3s;
      }

      .topic-card:hover {
        transform: translateY(-10px);
        border-color: var(--primary-yellow);
        box-shadow: 0 15px 35px rgba(245, 158, 11, 0.2);
      }

      .topic-card:hover::before {
        opacity: 1;
      }

      .icon-box {
        width: 60px;
        height: 60px;
        background: rgba(245, 158, 11, 0.1);
        color: var(--primary-yellow);
        border-radius: 12px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1.8rem;
        margin-bottom: 15px;
        transition: 0.3s;
      }

      .topic-card:hover .icon-box {
        background: var(--primary-yellow);
        color: var(--bg-dark);
      }

      .topic-card h3 {
        font-size: 1.25rem;
        font-weight: 700;
        margin-bottom: 8px;
      }

      .topic-card span {
        font-size: 0.85rem;
        color: var(--text-muted);
      }

      /* Footer */
      footer {
        text-align: center;
        padding: 25px;
        color: var(--text-muted);
        font-size: 0.9rem;
        border-top: 1px solid rgba(255, 255, 255, 0.05);
        z-index: 10;
      }

      /* Responsive cho Mobile */
      @media (max-width: 768px) {
        .hero h1 {
          font-size: 3rem;
        }
        .hero p {
          font-size: 1rem;
        }
        .topic-card {
          width: 100%;
          max-width: 320px;
        }
      }
    </style>
  </head>
  <body>
    <div class="glow-bg"></div>

    <!-- Thanh điều hướng trên cùng -->
    <header>
      <a href="#" class="logo-small">HYVORIA</a>
      <nav>
        <a href="#">Trang chủ</a>
        <a href="#">Giới thiệu</a>
        <a href="#">Tài liệu</a>
      </nav>
    </header>

    <!-- Nội dung chính -->
    <main class="hero">
      <div class="badge">
        <i class="fa-solid fa-graduation-cap"></i> Nền tảng học tập Đại học
      </div>

      <!-- Tên Web ở vị trí trung tâm -->
      <h1>Hyvoria Study</h1>

      <p>
        Hệ thống tổng hợp kiến thức, bài giảng và tài liệu chuyên sâu dành cho
        sinh viên.
      </p>

      <!-- Danh mục các môn học -->
      <div class="topics-grid">
        <!-- Mục Economics dẫn tới econMainn.html -->
        <a href="econMainn.html" class="topic-card">
          <div class="icon-box">
            <i class="fa-solid fa-chart-line"></i>
          </div>
          <h3>Economics</h3>
          <span>Kinh tế học & Tài chính</span>
        </a>

        <!-- Các mục khác làm ví dụ mẫu -->
        <a
          href="#"
          class="topic-card"
          style="opacity: 0.6; cursor: not-allowed"
        >
          <div class="icon-box">
            <i class="fa-solid fa-code"></i>
          </div>
          <h3>Computer Science</h3>
          <span>Sắp ra mắt...</span>
        </a>

        <a
          href="#"
          class="topic-card"
          style="opacity: 0.6; cursor: not-allowed"
        >
          <div class="icon-box">
            <i class="fa-solid fa-scale-balanced"></i>
          </div>
          <h3>Law</h3>
          <span>Sắp ra mắt...</span>
        </a>
      </div>
    </main>

    <!-- Footer -->
    <footer>
      <p>&copy; 2026 Hyvoria Study. All rights reserved.</p>
    </footer>
  </body>
</html>
